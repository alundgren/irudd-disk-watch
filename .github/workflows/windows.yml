name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DEBUG: pw:browser*
      ELECTRON_ENABLE_LOGGING: '1'
      ELECTRON_ENABLE_STACK_DUMPING: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.1.0
          run-install: false
          cache: true
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: vp install --frozen-lockfile
      - run: vp run test
      - run: vp run typecheck
      - run: vp run test:rust
      - name: Check Electron runtime
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          @'
          const { spawnSync } = require('node:child_process')
          const result = spawnSync('./node_modules/electron/dist/electron.exe', ['-p', 'JSON.stringify(process.versions)'], {
            encoding: 'utf8', windowsHide: true,
          })
          console.log(result.stdout)
          console.error(result.stderr)
          console.log('Electron Node-mode exit code:', result.status)
          if (result.error) console.error(result.error)
          process.exit(result.status ?? 1)
          '@ | vp exec node
      - run: vp run verify
      - run: vp run dist:win
      - run: vp run verify:packaged
      - uses: actions/upload-artifact@v7
        with:
          name: Disk-Watch-Windows-x64
          path: dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 7
