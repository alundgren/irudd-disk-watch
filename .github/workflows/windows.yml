name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: cargo test --manifest-path scanner/Cargo.toml
      - run: npm run verify
      - run: npm run dist:win
      - run: npm run verify:packaged
      - uses: actions/upload-artifact@v7
        with:
          name: Disk-Watch-Windows-x64
          path: dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 7
