name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.1.0
          run-install: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: vp install --frozen-lockfile
      - name: Package Mac app
        if: runner.os == 'macOS'
        run: |
          vp run dist:mac
          tar -C dist/mac-arm64 -czf dist/Disk-Watch-mac-arm64.tar.gz 'Disk Watch.app'
      - name: Package Windows app
        if: runner.os == 'Windows'
        run: |
          vp run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ runner.os }}
          path: |
            dist/Disk-Watch-mac-arm64.tar.gz
            dist/Disk-Watch-*-x64-Setup.exe
          if-no-files-found: error
  worker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: dw-scan-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: dw-scan-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build native static worker
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --release --locked --manifest-path scanner/Cargo.toml --target "$TARGET"
          binary="scanner/target/$TARGET/release/dw-scan"
          mkdir release
          cp "$binary" 'release/${{ matrix.asset }}'
      - uses: actions/upload-artifact@v7
        with:
          name: worker-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: [app, worker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Write release SHA256SUMS
        run: node scripts/release-manifest.mjs release
      - name: Publish immutable release without overwriting an existing tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed API read is not treated as permission to overwrite anything.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if printf '%s\n' "$existing" | grep -Fxq "$GITHUB_REF_NAME"; then echo 'Release already exists; refusing to overwrite'; exit 1; fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "Disk Watch $GITHUB_REF_NAME" --generate-notes
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets
          find release -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/actual-assets
          gh release edit "$GITHUB_REF_NAME" --draft=false
