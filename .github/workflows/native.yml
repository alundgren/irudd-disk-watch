name: Native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Require ARM64 for the Mac package
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.1.0
          run-install: false
          cache: true
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: vp install --frozen-lockfile
      - run: vp run test:rust
      - run: vp run test
      - name: Mac installer recovery checks
        if: runner.os == 'macOS'
        run: node --test scripts/install-mac.check.mjs
      - name: Mac incremental scan comparisons
        if: runner.os == 'macOS'
        run: python3 scanner/tests/macos_incremental.py scanner/target/release/dw-scan
      - name: Native protocol and cancellation fixtures
        run: python3 scanner/tests/worker_smoke.py scanner/target/release/dw-scan
      - run: vp run typecheck
      - run: vp run build
        if: runner.os == 'Linux'
      - name: Package personal Mac ARM64 app without launching
        if: runner.os == 'macOS'
        run: vp run dist:mac
      - name: Check bundled installer without system Node or app launch
        if: runner.os == 'macOS'
        run: node scripts/check-bundled-helper.mjs
      - name: Archive Mac app with executable permissions
        if: runner.os == 'macOS'
        run: tar -C dist/mac-arm64 -czf dist/Disk-Watch-mac-arm64.tar.gz 'Disk Watch.app'
      - name: Full packaged update and restart on isolated hosted Mac
        if: runner.os == 'macOS'
        run: |
          vp exec node scripts/build-updater-smoke.mjs
          vp exec node scripts/verify-update.mjs
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: Disk-Watch-macOS-arm64
          path: dist/Disk-Watch-mac-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Archive Linux worker with executable permissions
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C scanner/target/release -czf dist/dw-scan-linux-x64.tar.gz dw-scan
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: Disk-Watch-Linux-worker
          path: dist/dw-scan-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
