[package]
name = "dw-scan"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
unicode-general-category = "=1.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Wdk_Storage_FileSystem", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_SystemServices"] }

[profile.release]
lto = true
codegen-units = 1
