appId: com.irudd.diskwatch
productName: Disk Watch
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  extraResources:
    - from: scripts/install-windows.ps1
      to: install-windows.ps1
    - from: scanner/target/release/dw-scan.exe
      to: dw-scan.exe
    - from: build/icon.ico
      to: icon.ico
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  executableName: Disk Watch
  requestedExecutionLevel: asInvoker
  signExecutable: false
  signAndEditExecutable: true
nsis:
  artifactName: Disk-Watch-${version}-${arch}-Setup.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  runAfterFinish: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Disk Watch
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dir
      arch: arm64
  icon: dist/icon.icns
  identity: null
  hardenedRuntime: false
  notarize: false
  extraResources:
    - from: scanner/target/release/dw-scan
      to: dw-scan
    - from: build/icon.png
      to: icon.png
    - from: dist/helpers/install-mac.mjs
      to: install-mac.mjs
